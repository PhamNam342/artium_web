name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: |
          cd backend
          npm ci

      - name: Lint Code
        run: |
          cd backend
          npm run lint

      # - name: Run Tests
      #   run: |
      #     cd backend
      #     npm run test

      - name: Build Docker Image
        run: |
          cd backend
          docker build -t artium-backend:latest .
